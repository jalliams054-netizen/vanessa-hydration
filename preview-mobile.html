<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phone frame preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1020;
        font: 600 13px/1.4 system-ui, sans-serif;
        color: #8fa0c0;
      }
      .phone {
        width: 390px;
        height: 844px;
        border: 10px solid #1d2338;
        border-radius: 44px;
        overflow: hidden;
        box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.8);
      }
      iframe { width: 100%; height: 100%; border: 0; display: block }
    </style>
  </head>
  <body>
    <div class="phone"><iframe id="f" title="Vanessa's Hydration at 390px"></iframe></div>
    <script>
      const params = new URLSearchParams(location.search)
      const q = new URLSearchParams()
      for (const key of ['action', 'ml', 'hour']) if (params.get(key)) q.set(key, params.get(key))
      document.getElementById('f').src = '/?' + q.toString()
    </script>
  </body>
</html>
